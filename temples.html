<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album - WDD 131</title>
    <meta name="description"
        content="A responsive photo album showcasing temples from around the world, created as part of the WDD 131 Dynamic Web Fundamentals course.">

    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
    <header>
        <p class="site-title">Temple Album</p>
        <button id="menu" aria-label="Toggle navigation menu"></button>
        <nav>
