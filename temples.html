<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album - WDD 131</title>
    <meta name="description"
        content="A responsive photo album showcasing temples from around the world, created as part of the WDD 131 Dynamic Web Fundamentals course.">
    <meta name="author" content="Selassie Kwabla Heloo">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">
    <script src="scripts/temples.js" defer></script>

<body>
    <header>
        <p class="site-title">Temple Album</p>
        <button id="menu" aria-label="Toggle navigation menu"></button>
        <nav>
            <ul class="navigation">
                <li><a href="#" title="Home" class="active">Home</a></li>
                <li><a href="#" title="Old Temples">Old</a></li>
                <li><a href="#" title="New Temples">New</a></li>

    </header>

    <main>
        <h1>Selassie Kwabla Heloo</h1>
        <h2>Temple Album - WDD 131</h2>
        <div class="container">
            <figure>
                <img src="images/salt-lake-temple.jpg" alt="Salt Lake Temple" loading="lazy">

            <figure>
                <img src="images/accra-ghana-temple.jpg" alt="Accra Ghana Temple" loading="lazy">
